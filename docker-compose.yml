version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coursera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coursera
      POSTGRES_USER: coursera
      POSTGRES_PASSWORD: coursera
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursera -d coursera"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: coursera-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursera-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
    env_file:
      - .env
    environment:
      APP_ENV: production
      BACKEND_PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://coursera:coursera@postgres:5432/coursera
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MAX_REQUEST_SIZE_BYTES: "10485760"
      MAX_UPLOAD_SIZE_BYTES: "52428800"
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend

volumes:
  postgres_data:
  qdrant_data:
