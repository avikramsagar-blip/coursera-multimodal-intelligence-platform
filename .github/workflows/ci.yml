name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coursera_test
          POSTGRES_USER: coursera
          POSTGRES_PASSWORD: coursera
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coursera -d coursera_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://coursera:coursera@localhost:5432/coursera_test
      JWT_SECRET_KEY: test-secret-key-for-ci
      SECRET_KEY: test-secret-key-for-ci
      GEMINI_API_KEY: test-gemini-key
      GOOGLE_API_KEY: test-gemini-key
      OBJECT_STORAGE_PROVIDER: s3
      AWS_S3_BUCKET: test-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-key
      AWS_SECRET_ACCESS_KEY: test-secret
      AWS_S3_PUBLIC_URL: https://example.invalid/test-bucket
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION_PREFIX: course
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MAX_REQUEST_SIZE_BYTES: "10485760"
      MAX_UPLOAD_SIZE_BYTES: "52428800"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker build
        run: docker build -t coursera-backend:test .
