services:
  - type: web
    name: coursera-backend
    env: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: BACKEND_PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OBJECT_STORAGE_PROVIDER
        value: s3
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_PUBLIC_URL
        sync: false
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_PREFIX
        value: course
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_REQUEST_SIZE_BYTES
        value: "10485760"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "52428800"
      - key: ENABLE_SECURITY_HEADERS
        value: "true"

# PostgreSQL is managed separately in Render and should be linked to the app by setting DATABASE_URL.
# Qdrant should be provisioned as a managed or self-hosted service and configured via QDRANT_URL/QDRANT_API_KEY.
